<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0F2A56">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>SIKasapa — Sistem Informasi Keuangan Ekstrakurikuler SDN 01 Papahan</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1E3D; --muted:#64748B; --line:#E2E8F0;
    --navy:#0F2A56; --navy-2:#123B78; --blue:#1D5FD6; --blue-2:#2563EB;
  }
  *{ box-sizing:border-box; font-family:'Plus Jakarta Sans',system-ui,sans-serif; }
  html,body{ margin:0; min-height:100%; }
  body{ background:#0B1E3D; color:var(--ink); -webkit-font-smoothing:antialiased; }

  #loginScreen{
    position:relative; min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:max(20px, env(safe-area-inset-top,0px)) 18px max(24px, env(safe-area-inset-bottom,0px));
    overflow:hidden;
    background:
      radial-gradient(860px 560px at 12% -8%, rgba(59,130,246,.32), transparent 62%),
      radial-gradient(760px 520px at 108% 108%, rgba(29,95,214,.42), transparent 62%),
      linear-gradient(160deg,#0B1E3D 0%, #0F2A56 56%, #123B78 100%);
  }
  #loginScreen::before{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:.35;
    background-image:radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);
    background-size:22px 22px;
  }

  .lg-wrap{ position:relative; z-index:1; width:100%; max-width:392px; }
  .lg-card{
    background:rgba(255,255,255,.98); border-radius:28px; padding:34px 26px 24px;
    box-shadow:0 36px 70px -24px rgba(2,8,23,.6), 0 0 0 1px rgba(255,255,255,.5) inset;
    animation:lgIn .6s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes lgIn{ from{opacity:0; transform:translateY(14px) scale(.985);} to{opacity:1; transform:none;} }

  .lg-brand{ text-align:center; margin-bottom:24px; }
  .lg-mark{
    width:66px; height:66px; margin:0 auto 16px; border-radius:20px; background:#fff; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 14px 28px -14px rgba(15,42,86,.55), 0 0 0 1px rgba(15,42,86,.08);
  }
  .lg-mark img{ width:100%; height:100%; object-fit:contain; padding:5px; }
  .lg-title{ margin:0; font-size:23px; font-weight:800; letter-spacing:-.02em; color:var(--ink); }
  .lg-welcome{ margin:8px 0 0; font-size:15px; font-weight:700; line-height:1.4; color:var(--navy-2); }
  .lg-school{ display:block; margin-top:4px; font-size:21px; font-weight:800; letter-spacing:.04em; color:var(--navy); }
  .lg-sub{ margin:6px 0 0; font-size:13px; color:var(--muted); }

  .lg-form{ margin:0; }
  .lg-label{ display:block; font-size:12px; font-weight:700; color:#334155; margin:14px 0 7px 2px; letter-spacing:.01em; }
  .lg-label:first-child{ margin-top:0; }
  .lg-field{ position:relative; }
  .lg-ico{
    position:absolute; left:15px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; color:#94A3B8; pointer-events:none; transition:color .15s ease;
  }
  .lg-input{
    width:100%; height:50px; border-radius:16px; border:1.5px solid var(--line);
    background:#F8FAFC; padding:0 14px 0 44px; font:inherit; font-size:15px; color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
  }
  .lg-input[type=password]{ padding-right:48px; }
  .lg-input::placeholder{ color:#A1AEC0; }
  .lg-input:hover{ border-color:#CBD5E1; }
  .lg-input:focus{ outline:none; border-color:var(--blue-2); background:#fff; box-shadow:0 0 0 4px rgba(37,99,235,.14); }
  .lg-field:focus-within .lg-ico{ color:var(--blue-2); }
  .lg-field .pw-eye{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    border-radius:12px; border:0; background:transparent; color:#94A3B8; cursor:pointer;
    transition:color .15s ease, background-color .15s ease;
  }
  .lg-field .pw-eye:hover{ background:#EEF2F7; color:#334155; }
  .lg-field .pw-eye:focus-visible{ outline:2px solid rgba(37,99,235,.5); outline-offset:1px; }

  .lg-error{
    margin:16px 0 0; padding:10px 13px; border-radius:12px;
    background:#FFF1F2; border:1px solid #FECDD3; color:#BE123C;
    font-size:12.5px; font-weight:600; line-height:1.5;
  }
  .lg-error.hidden{ display:none; }

  .lg-btn{
    margin-top:20px; width:100%; height:52px; border:0; border-radius:16px;
    display:flex; align-items:center; justify-content:center; gap:9px;
    color:#fff; font-size:15px; font-weight:700; letter-spacing:.01em; cursor:pointer;
    background:linear-gradient(135deg,#0F2A56 0%, #1D5FD6 100%);
    box-shadow:0 18px 32px -16px rgba(29,95,214,.8);
    transition:transform .15s ease, filter .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .lg-btn:hover{ filter:brightness(1.07); transform:translateY(-1px); }
  .lg-btn:active{ transform:translateY(0) scale(.985); }
  .lg-btn:disabled{ cursor:not-allowed; transform:none; }
  .lg-btn svg{ width:18px; height:18px; }

  .lg-back{
    display:flex; align-items:center; justify-content:center; gap:6px; margin-top:22px;
    font-size:12.5px; font-weight:600; color:var(--muted); text-decoration:none;
    transition:color .15s ease;
  }
  .lg-back:hover{ color:var(--blue); }
  .lg-back svg{ width:14px; height:14px; }
  .hidden{ display:none; }

  @media (max-width:420px){
    .lg-card{ padding:30px 20px 22px; border-radius:26px; }
    .lg-title{ font-size:22px; }
  }
  @media (prefers-reduced-motion:reduce){ .lg-card{ animation:none; } }
</style>
<body>

<div id="loginScreen" style="display:none">
  <main class="lg-wrap">
    <section id="loginCard" class="lg-card">
      <header class="lg-brand">
        <div class="lg-mark"><img src="assets/logo-icon.png" alt="Logo SIKasapa"></div>
        <h1 class="lg-title">Selamat datang</h1>
        <p class="lg-welcome">Admin Keuangan Ekstrakurikuler<span class="lg-school">SDN 01 PAPAHAN</span></p>
      </header>

      <form id="formLogin" class="lg-form" autocomplete="on">
        <label class="lg-label" for="loginUsername">Username</label>
        <div class="lg-field">
          <svg class="lg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input id="loginUsername" class="lg-input" type="text" required autocomplete="username" placeholder="Masukkan username" spellcheck="false">
        </div>

        <label class="lg-label" for="loginPassword">Password</label>
        <div class="lg-field">
          <svg class="lg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="loginPassword" class="lg-input" type="password" required autocomplete="current-password" placeholder="Masukkan password">
          <button type="button" class="pw-eye" aria-label="Tampilkan password" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>

        <p id="loginError" class="lg-error hidden" role="alert"></p>

        <button type="submit" class="lg-btn">
          <span>Masuk</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <a class="lg-back" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Kembali ke halaman wali murid
      </a>
    </section>
  </main>
</div>

<div id="toast" class="fixed bottom-5 right-5 z-50 hidden"></div>

<script src="assets/logo-default.js"></script>
<script src="script_core.js"></script>
<script>
window.addEventListener('DOMContentLoaded', initLoginPage);
</script>
</body>
</html>
